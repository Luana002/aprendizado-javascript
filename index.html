<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Testando Javascript</h1>

    <div>
        <h4>Texto aparece e some quando clica</h4>
        <button onclick="mostrarTexto()">Aparecer texto</button>
        <button onclick="apagarTexto()">Apagar texto</button>
        <p id="Texto"></p>
    </div>

    <div>
        <h4>Fatiamento</h4>
        <button onclick="botaoFatiamento()">Fatiar o texto</button>
        <button onclick="voltarFatiamento()">Voltar o texto</button>
        <p id="textoFatiado">O rato roeu a roupa do rei de roma</p>
    </div>

    <div>
        <h4>Gerador de números aleatórios e cores</h4>
        <button onclick="gerarNumero()">Aperte para gerar algum número</button>
        <p id="Numero"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
