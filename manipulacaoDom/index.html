<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendizado Javascript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="mainText">Testando Javascript</h1>

<div class="container">
    <div id="boxes">
        <h3>Texto aparece e some quando clica</h3>
        <button id="buttonOne"
        onclick="mostrarTexto()">Aparecer texto</button>
        <button id="buttonTwo" 
        onclick="apagarTexto()">Apagar texto</button>
        <p id="Texto"></p>
    </div>

    <div id="boxes">
        <h3>Fatiamento</h3>
        <button id="buttonOne" 
        onclick="botaoFatiamento()">Fatiar o texto</button>
        <button id="buttonTwo"  
        onclick="voltarFatiamento()">Voltar o texto</button>
        <p id="textoFatiado">O rato roeu a roupa do rei de roma</p>
    </div>

    <div id="boxes">
        <h3>Gerador de números aleatórios e cores</h3>
        <button id="buttonOne"
        onclick="gerarNumero()">Aperte para gerar algum número</button>
        <p id="Numero"></p>
    </div>

    <div id="boxes">
        <h3>Gerador de letra maiuscula</h3>
        <button id="buttonOne" onclick="geradorMaius()">Transformar em maiusculo</button>
        <button id="buttonTwo" onclick="removerMaius()">Voltar para minusculo</button>
        <p id="maiusculo">texto</p>
    </div>

    <div id="boxes">
        <h3>Trocar a cor da pagina</h3>
        <button id="buttonOne" onclick="corFundo()">Trocar cor de fundo</button>
    </div>

    <div id="boxes">
        <h3>Acessar código de um caractere<h3>
        <label>Digite uma letra</label>
        <input type="text" id="inputText">
        <button id="buttonOne" onclick="char()">Descobrir numero</button>
    </div>
</div>

    <script src="script.js"></script>
</body>
</html>
